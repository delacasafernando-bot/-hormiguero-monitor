name: Monitor El Hormiguero

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar nuevas fechas
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 <<'PY'
          import re
          import html
          import requests
          from urllib.parse import urljoin

          URL = "https://entradas.7yaccion.com/"

          r = requests.get(
              URL,
              headers={"User-Agent": "Mozilla/5.0"},
              timeout=30
          )
          r.raise_for_status()

          page = r.text

          pattern = re.compile(
              r'<a[^>]+href=["\']([^"\']*?/evento/[^"\']*)["\'][^>]*>(.*?)</a>',
              re.I | re.S
          )

          eventos = set()

          for href, contenido in pattern.findall(page):
              href = urljoin(URL, html.unescape(href))
              texto = re.sub(r"<[^>]+>", " ", contenido)
              texto = html.unescape(texto)
              texto = " ".join(texto.split())

              eventos.add(f"{texto}|{href}")

          eventos = sorted(eventos)

          archivo = "eventos_conocidos.txt"

          try:
              with open(archivo, "r", encoding="utf-8") as f:
                  conocidos = set(x.strip() for x in f if x.strip())
          except FileNotFoundError:
              conocidos = set()

          actuales = set(eventos)
          nuevas = actuales - conocidos

          print(f"Eventos encontrados: {len(actuales)}")
          print(f"Eventos nuevos: {len(nuevas)}")

          if nuevas:
              print("NUEVAS FECHAS DETECTADAS:")
              for evento in sorted(nuevas):
                  print(evento)

          with open(archivo, "w", encoding="utf-8") as f:
              for evento in sorted(actuales):
                  f.write(evento + "\n")
          PY

      - name: Guardar estado
        run: |
          git config user.name "Hormiguero Monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eventos_conocidos.txt
          git diff --cached --quiet || git commit -m "Actualizar fechas conocidas"
          git push
